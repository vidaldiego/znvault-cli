name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: znvault-cli-npm-publication
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned npm with OIDC support
        run: npm install -g npm@11.10.1
      - name: Verify tag, main and version metadata
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Clean production build
        run: npm run build:prod
      - name: Pack once and verify the exact installable artifact
        run: |
          mkdir -p "$RUNNER_TEMP/cli-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/cli-release" --json > "$RUNNER_TEMP/cli-pack.json"
          PACKAGE_FILE=$(node -p "require(process.env.RUNNER_TEMP + '/cli-pack.json')[0].filename")
          PACKAGE_PATH="$RUNNER_TEMP/cli-release/$PACKAGE_FILE"
          node scripts/verify-package.mjs "$PACKAGE_PATH" "${GITHUB_REF_NAME#v}"
          sha256sum "$PACKAGE_PATH" > "$RUNNER_TEMP/cli-package.sha256"
          printf 'PACKAGE_PATH=%s\n' "$PACKAGE_PATH" >> "$GITHUB_ENV"
      - name: Preserve release artifact and digest
        uses: actions/upload-artifact@v4
        with:
          name: cli-package-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/cli-release/*.tgz
            ${{ runner.temp }}/cli-package.sha256
          if-no-files-found: error
      - name: Publish verified tarball using OIDC
        run: |
          sha256sum --check "$RUNNER_TEMP/cli-package.sha256"
          npm publish "$PACKAGE_PATH" --ignore-scripts --access public --provenance --tag latest
