name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        # Pin to a known-good version. `npm@latest` periodically ships
        # broken artifacts (e.g. "Cannot find module 'promise-retry'" on
        # 2026-05-15). Pinning to a known-good 10.x line keeps OIDC
        # trusted publishing working without inheriting the breakage.
        run: npm install -g npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (Trusted Publishing via OIDC)
        run: npm publish --access public --provenance
