name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24.22.1', '26']

    # PostgreSQL is retained for the restore-drill integration test.
    # LMK preflight runs through the server API; its DB tests live in core.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: znvault_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: znvault_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U znvault_test -d znvault_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Check pinned recovery source snapshot
        run: npm run recovery-core:check

      - name: Build
        run: npm run build

      # The key-lifecycle schema step that used to live here is GONE, along with
      # the verbatim copy of zn-vault's migration 093 it applied. The ceremony no
      # longer talks to PostgreSQL: the exclusion, the compare-and-swap and the
      # append-only history are proven where they are enforced — in the server's
      # own E2E suite (test/e2e/96-key-lifecycle-routes.test.ts) — and this CLI
      # is tested against the API. That removes a second copy of a contract, and
      # with it a whole class of silent drift.
      - name: Run Tests
        run: npm test
        env:
          # The restore drill still exercises a real PostgreSQL. The name is
          # DRILL_, not PREFLIGHT_: the preflight moved to the server's API and
          # no longer opens a database connection, so a variable still named
          # after it would send the next reader looking in the wrong place.
          # `test/lib/restore-drill-ci-wiring.test.ts` pins this.
          DRILL_TEST_DATABASE_URL: postgres://znvault_test:test_password_123@localhost:5433/znvault_test

      - name: Complete local backup recovery contracts
        run: npm run test:recovery

      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # This is a blocking, real-client proof for the recovery exec fence. Both
  # client families historically interpret `\\!` / `system` locally unless
  # `--binary-mode` is forced, so a unit assertion over argv is insufficient.
  mysql-client-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'

      - name: Install dependencies
        run: npm ci

      - name: Pull real database clients
        run: |
          docker pull mysql:8.4
          docker pull mariadb:11

      - name: Prove binary-mode fence with MySQL 8.4 and MariaDB 11
        run: npm run test:mysql-client-security

  recovery-artifact:
    name: Recovery exact artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - run: npm ci
      - name: Actual package and offline process contracts
        run: |
          npm run build
          npx vitest run --config vitest.integration.config.ts test/integration/recovery-offline-process.integration.test.ts
      - name: Pack exact clean candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/pack-recovery-package.mjs "$RUNNER_TEMP/recovery-candidate" "$EXPECTED_SHA"
      - name: Prepare Linux isolation image
        if: runner.os == 'Linux'
        run: docker pull node:24.22.1-bookworm-slim
      - name: Verify installed exact candidate with OS egress denied
        run: |
          PACKAGE_PATH=$(node -p "require(process.env.RUNNER_TEMP + '/recovery-candidate/candidate.json').artifact")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-package.mjs "$PACKAGE_PATH" "$PACKAGE_VERSION"
          node scripts/prepare-recovery-fixtures.mjs "$PWD" "$PWD/test/fixtures/recovery" "$RUNNER_TEMP/recovery-fixtures"
          node scripts/verify-recovery-package.mjs "$PACKAGE_PATH" "$RUNNER_TEMP/recovery-candidate/candidate.json" "$RUNNER_TEMP/recovery-fixtures"
