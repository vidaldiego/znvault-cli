name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    # The BSK-rotation preflight opens a REPEATABLE READ READ ONLY transaction
    # and the only honest proof of that is PostgreSQL refusing a write inside
    # it (SQLSTATE 25006). Inspecting the SQL string would prove the spelling,
    # not the guarantee. See test/lib/db/preflight-readonly.test.ts — and
    # preflight-ci-wiring.test.ts, which fails if this service disappears.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: znvault_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: znvault_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U znvault_test -d znvault_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test
        env:
          PREFLIGHT_TEST_DATABASE_URL: postgres://znvault_test:test_password_123@localhost:5433/znvault_test

      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
