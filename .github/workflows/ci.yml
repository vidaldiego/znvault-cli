name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    # The BSK-rotation preflight opens a REPEATABLE READ READ ONLY transaction
    # and the only honest proof of that is PostgreSQL refusing a write inside
    # it (SQLSTATE 25006). Inspecting the SQL string would prove the spelling,
    # not the guarantee. See test/lib/db/preflight-readonly.test.ts — and
    # preflight-ci-wiring.test.ts, which fails if this service disappears.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: znvault_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: znvault_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U znvault_test -d znvault_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The key-lifecycle schema step that used to live here is GONE, along with
      # the verbatim copy of zn-vault's migration 093 it applied. The ceremony no
      # longer talks to PostgreSQL: the exclusion, the compare-and-swap and the
      # append-only history are proven where they are enforced — in the server's
      # own E2E suite (test/e2e/96-key-lifecycle-routes.test.ts) — and this CLI
      # is tested against the API. That removes a second copy of a contract, and
      # with it a whole class of silent drift.
      - name: Run Tests
        run: npm test
        env:
          # The restore drill still exercises a real PostgreSQL. The name is
          # DRILL_, not PREFLIGHT_: the preflight moved to the server's API and
          # no longer opens a database connection, so a variable still named
          # after it would send the next reader looking in the wrong place.
          # `test/lib/restore-drill-ci-wiring.test.ts` pins this.
          DRILL_TEST_DATABASE_URL: postgres://znvault_test:test_password_123@localhost:5433/znvault_test

      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # This is a blocking, real-client proof for the recovery exec fence. Both
  # client families historically interpret `\\!` / `system` locally unless
  # `--binary-mode` is forced, so a unit assertion over argv is insufficient.
  mysql-client-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Pull real database clients
        run: |
          docker pull mysql:8.4
          docker pull mariadb:11

      - name: Prove binary-mode fence with MySQL 8.4 and MariaDB 11
        run: npm run test:mysql-client-security
