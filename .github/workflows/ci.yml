name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    # The BSK-rotation preflight opens a REPEATABLE READ READ ONLY transaction
    # and the only honest proof of that is PostgreSQL refusing a write inside
    # it (SQLSTATE 25006). Inspecting the SQL string would prove the spelling,
    # not the guarantee. See test/lib/db/preflight-readonly.test.ts — and
    # preflight-ci-wiring.test.ts, which fails if this service disappears.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: znvault_test
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: znvault_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U znvault_test -d znvault_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The ceremony's exclusion, append-only history and crash-resumability are
      # properties of the DATABASE (zn-vault migration 093), so the schema has to
      # exist for the proof to run.
      #
      # The fixture is a VERBATIM COPY of the server's migration, which is a
      # second copy of a contract and therefore a drift risk. It is copied rather
      # than fetched because this package publishes to npm on its own and CI has
      # no access to the server repo. The drift is caught by
      # `test/lib/db/schema-fixture-drift.test.ts`, which compares the two byte
      # for byte whenever both repos are checked out side by side.
      - name: Apply key-lifecycle schema (093_key_lifecycle_operations)
        run: |
          PGPASSWORD=test_password_123 psql -h localhost -p 5433 -U znvault_test \
            -d znvault_test -v ON_ERROR_STOP=1 -f test/fixtures/093_key_lifecycle_operations.sql

      - name: Run Tests
        run: npm test
        env:
          PREFLIGHT_TEST_DATABASE_URL: postgres://znvault_test:test_password_123@localhost:5433/znvault_test
          CEREMONY_TEST_DATABASE_URL: postgres://znvault_test:test_password_123@localhost:5433/znvault_test

      - name: Typecheck
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
